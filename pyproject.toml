[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portexa-tracking-engine"
version = "0.1.0"
description = "Independent, compliant multi-carrier shipment tracking scheduler"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
portexa-tracking = "portexa_tracking.cli:main"
portexa-tracking-ui = "portexa_tracking.dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
