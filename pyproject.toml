[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portexa-tracking-engine"
version = "0.1.0"
description = "Independent, compliant multi-carrier shipment tracking scheduler"
requires-python = ">=3.11"
dependencies = ["flask>=3.0,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
portexa-tracking = "portexa_tracking.cli:main"
portexa-tracking-ui = "portexa_tracking.dashboard:main"
portexa-operations-ui = "portexa_tracking.operations_web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
portexa_tracking = ["source_page.html"]
