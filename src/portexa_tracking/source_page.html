<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PORTEXA | مراجعة الشحنات</title><style>
:root{font-family:Tahoma,Arial,sans-serif;background:#091728;color:#eaf2fa;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:24px 14px}h1{color:#e6bf71}button,input,textarea,select{font:inherit;padding:10px;border-radius:8px}button{background:#d9b46b;border:0;color:#132339;font-weight:bold;cursor:pointer}input,textarea,select{background:#0a1d31;border:1px solid #50657d;color:white;width:100%}label{display:block;margin:10px 0}article{background:#122840;border:1px solid #36516a;border-radius:12px;padding:18px;margin:12px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.muted{color:#a9b9ca}strong{color:#f0c981}small{display:block;margin:8px 0}#msg{white-space:pre-wrap;color:#f0c981}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}@media(max-width:650px){.fields{grid-template-columns:1fr}}
</style></head><body><main><h1>PORTEXA | إكمال بيانات الشحنات</h1><p class="muted">قراءة مباشرة من قاعدة النظام الأساسي. التعديل معطل افتراضياً، ولا يعمل إلا بتفعيل صريح على السيرفر.</p><div class="row"><label>عرض<select id="filter"><option value="1">بوالص ناقصة</option><option value="0">كل الشحنات</option></select></label><button id="load">تحديث القائمة</button></div><p id="msg" role="status"></p><div id="items"></div></main><script>
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={bol_no:'رقم البوليصة',msc_tracking:'رقم أو رابط التتبع',ship_date:'تاريخ الشحن',arrival_date:'تاريخ الوصول',shipping_details:'تفاصيل الشحن'};
let rows=[];
async function load(){ $('msg').textContent='جاري القراءة...';try{const r=await fetch('/api/source-shipments?missing='+$('filter').value);const d=await r.json();if(!r.ok)throw Error(d.error);rows=d;$('items').innerHTML=rows.length?rows.map((s,i)=>'<article><strong>شحنة #'+s.id+'</strong><small>مالك السجل #'+esc(s.owner_id)+' · فاتورة '+esc(s.invoice_no||'—')+' · الحالة '+esc(s.status)+'</small><div class="fields">'+Object.keys(labels).map(k=>'<label>'+labels[k]+(k.endsWith('_date')?'<input type="date"':'<input type="text"')+' data-index="'+i+'" data-field="'+k+'" value="'+esc(s[k]||'')+'"></label>').join('')+'</div><button data-save="'+i+'">حفظ التغييرات</button></article>').join(''):'لا توجد سجلات مطابقة';$('msg').textContent='عدد السجلات: '+rows.length}catch(e){$('msg').textContent='تعذر قراءة البيانات: '+e.message}}
$('items').onclick=async e=>{const btn=e.target.closest('button[data-save]');if(!btn)return;const i=Number(btn.dataset.save),s=rows[i],values={},expected={};for(const el of document.querySelectorAll('[data-index="'+i+'"]')){const k=el.dataset.field;const v=el.value.trim()||null;if(v!==(s[k]||null)){values[k]=v;expected[k]=s[k]}}if(!Object.keys(values).length){$('msg').textContent='ماكو تغييرات';return}if(!confirm('تأكيد تحديث الشحنة #'+s.id+' في قاعدة PORTEXA؟'))return;try{const r=await fetch('/api/source-shipments/'+s.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({values,expected})});const d=await r.json();if(!r.ok)throw Error(d.error);$('msg').textContent='تم الحفظ للشحنة #'+s.id;await load()}catch(err){$('msg').textContent='لم يتم الحفظ: '+err.message}};
$('load').onclick=load;load();
</script></body></html>
